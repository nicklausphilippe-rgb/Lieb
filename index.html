<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hat Phil lieb? 💛</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #FF6B9D;
      --coral: #FF8C69;
      --cream: #FFF8E7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-heart   { position: absolute; opacity: 0.12; animation: floatUp linear infinite; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh); opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
    .container { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 480px; width: 100%; }
    .deco { font-size: 2rem; margin-bottom: 0.5rem; display: block; animation: wobble 2s ease-in-out infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
    .title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2rem, 8vw, 3.2rem);
      color: var(--pink);
      text-shadow: 3px 3px 0 rgba(255,107,157,0.2);
      margin-bottom: 0.4rem;
    }
    .subtitle { font-size: 1rem; color: var(--coral); font-weight: 700; margin-bottom: 2.5rem; letter-spacing: .05em; }
    .ask-btn {
      background: linear-gradient(135deg, var(--pink), var(--coral));
      color: white; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.3rem;
      padding: 1.1rem 2.8rem; border: none; border-radius: 999px; cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,107,157,.45);
      transition: transform .15s, box-shadow .15s;
    }
    .ask-btn:hover  { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 32px rgba(255,107,157,.5); }
    .ask-btn:active { transform: scale(.97); }

    /* card: always in DOM, toggled via opacity+transform only */
    .answer-card {
      margin-top: 2rem;
      background: white; border-radius: 28px; padding: 1.8rem 2rem;
      box-shadow: 0 12px 40px rgba(255,107,157,.15), 0 2px 8px rgba(0,0,0,.05);
      opacity: 0;
      transform: scale(.7) translateY(20px);
      transition: opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .answer-card.show { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
    .answer-yes {
      font-family: 'Pacifico', cursive; font-size: 3.5rem; color: var(--pink); line-height: 1;
      margin-bottom: .4rem; animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .answer-text { font-size: 1rem; color: #999; font-weight: 700; margin-bottom: 1.2rem; }
    .anim-frame {
      width: 100%; max-width: 300px; height: 185px; border-radius: 18px; overflow: hidden;
      margin: 0 auto; box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .anim-frame svg { width: 100%; height: 100%; }

    /* confetti */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
    .cp { position: absolute; border-radius: 2px; animation: cf linear forwards; }
    @keyframes cf {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="bg-hearts" id="bgHearts"></div>
<div class="confetti-wrap" id="confetti"></div>

<div class="container">
  <span class="deco">🌟</span>
  <h1 class="title">Hat Phil lieb?</h1>
  <p class="subtitle">Die wichtigste Frage der Welt</p>

  <button class="ask-btn" id="askBtn">💛 Frag nach!</button>

  <div class="answer-card" id="card">
    <div class="answer-yes">JA!</div>
    <p class="answer-text" id="answerText"></p>
    <div class="anim-frame" id="animFrame"></div>
  </div>
</div>

<script>
/* ── floating bg hearts ── */
const bgEl = document.getElementById('bgHearts');
['💛','💖','🌸','✨','🌈','💕','🥰','🌻'].forEach(e => {
  for (let i = 0; i < 2; i++) {
    const d = document.createElement('div');
    d.className = 'bg-heart';
    d.textContent = e;
    d.style.cssText = `left:${Math.random()*100}vw;font-size:${1+Math.random()*1.5}rem;animation-duration:${9+Math.random()*10}s;animation-delay:${Math.random()*14}s`;
    bgEl.appendChild(d);
  }
});

/* ── answer pool ── */
const answers = [
  {
    text: "Natürlich, immer und für immer! 💛",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#FFF8E7"/>
      <text x="75"  y="108" font-size="52" text-anchor="middle">💛<animateTransform attributeName="transform" type="translate" values="0,0;0,-26;0,0" dur=".8s" repeatCount="indefinite"/></text>
      <text x="150" y="108" font-size="64" text-anchor="middle">💖<animateTransform attributeName="transform" type="translate" values="0,0;0,-26;0,0" dur=".8s" begin=".25s" repeatCount="indefinite"/></text>
      <text x="225" y="108" font-size="52" text-anchor="middle">💛<animateTransform attributeName="transform" type="translate" values="0,0;0,-26;0,0" dur=".8s" begin=".5s" repeatCount="indefinite"/></text>
      <text x="150" y="168" font-size="14" text-anchor="middle" fill="#FF6B9D" font-family="sans-serif" font-weight="bold">Immer &amp; für immer!</text>
    </svg>`
  },
  {
    text: "Ja, so sehr wie Sonnenschein! ☀️",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#FFFDE7"/>
      <g transform="translate(150,85)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
          <line x1="0" y1="-52" x2="0" y2="-40" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="0" y1="52" x2="0" y2="40" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="-52" y1="0" x2="-40" y2="0" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="52" y1="0" x2="40" y2="0" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="-37" y1="-37" x2="-28" y2="-28" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="37" y1="-37" x2="28" y2="-28" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="-37" y1="37" x2="-28" y2="28" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
          <line x1="37" y1="37" x2="28" y2="28" stroke="#FFD93D" stroke-width="5" stroke-linecap="round"/>
        </g>
        <circle r="34" fill="#FFD93D"/>
        <text x="0" y="13" font-size="30" text-anchor="middle">😊</text>
      </g>
      <text x="150" y="170" font-size="14" text-anchor="middle" fill="#FF8C69" font-family="sans-serif" font-weight="bold">Warm ums Herz!</text>
    </svg>`
  },
  {
    text: "Ohne jeden Zweifel! 🌸",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#FFF0F5"/>
      <text x="50"  font-size="38" text-anchor="middle"><animate attributeName="y" values="70;44;70" dur="2s" repeatCount="indefinite"/>🌸</text>
      <text x="150" font-size="52" text-anchor="middle"><animate attributeName="y" values="92;65;92" dur="1.8s" begin=".3s" repeatCount="indefinite"/>🌺</text>
      <text x="250" font-size="38" text-anchor="middle"><animate attributeName="y" values="70;44;70" dur="2.2s" begin=".5s" repeatCount="indefinite"/>🌸</text>
      <text x="100" font-size="30" text-anchor="middle"><animate attributeName="y" values="145;120;145" dur="1.9s" begin=".4s" repeatCount="indefinite"/>🌷</text>
      <text x="200" font-size="30" text-anchor="middle"><animate attributeName="y" values="145;122;145" dur="2.1s" begin=".2s" repeatCount="indefinite"/>🌷</text>
      <text x="150" y="178" font-size="14" text-anchor="middle" fill="#FF6B9D" font-family="sans-serif" font-weight="bold">Ohne jeden Zweifel!</text>
    </svg>`
  },
  {
    text: "Phil liebt wie kein Zweiter! 🥰",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#FFF5F5"/>
      <text x="150" y="115" font-size="82" text-anchor="middle">❤️<animateTransform attributeName="transform" type="scale" values="1,1;1.2,1.2;1,1" dur=".9s" repeatCount="indefinite" additive="sum" transformOrigin="150 82"/></text>
      <text x="45"  y="60"  font-size="22"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>💕</text>
      <text x="238" y="60"  font-size="22"><animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>💕</text>
      <text x="45"  y="138" font-size="18"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin=".3s" repeatCount="indefinite"/>✨</text>
      <text x="238" y="138" font-size="18"><animate attributeName="opacity" values="1;0;1" dur="1.4s" begin=".3s" repeatCount="indefinite"/>✨</text>
      <text x="150" y="176" font-size="14" text-anchor="middle" fill="#FF6B9D" font-family="sans-serif" font-weight="bold">Wie kein Zweiter!</text>
    </svg>`
  },
  {
    text: "Mehr als alle Sterne zusammen! ⭐",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#1a1a2e"/>
      <text x="28"  y="38"  font-size="20"><animate attributeName="opacity" values="1;.1;1" dur="1.3s" begin="0s"   repeatCount="indefinite"/>⭐</text>
      <text x="98"  y="28"  font-size="16"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" begin=".2s"  repeatCount="indefinite"/>✨</text>
      <text x="178" y="42"  font-size="22"><animate attributeName="opacity" values="1;.1;1" dur="1.1s" begin=".4s"  repeatCount="indefinite"/>⭐</text>
      <text x="252" y="32"  font-size="18"><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" begin=".1s"  repeatCount="indefinite"/>✨</text>
      <text x="18"  y="98"  font-size="16"><animate attributeName="opacity" values="1;.2;1" dur="2.0s" begin=".6s"  repeatCount="indefinite"/>⭐</text>
      <text x="265" y="92"  font-size="20"><animate attributeName="opacity" values=".1;1;.1" dur="1.4s" begin=".3s"  repeatCount="indefinite"/>✨</text>
      <text x="58"  y="153" font-size="18"><animate attributeName="opacity" values="1;.1;1" dur="1.2s" begin=".5s"  repeatCount="indefinite"/>⭐</text>
      <text x="208" y="158" font-size="16"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" begin=".7s"  repeatCount="indefinite"/>✨</text>
      <text x="150" y="106" font-size="48" text-anchor="middle"><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/>🌟</text>
      <text x="150" y="178" font-size="14" text-anchor="middle" fill="#FFD93D" font-family="sans-serif" font-weight="bold">Mehr als alle Sterne!</text>
    </svg>`
  },
  {
    text: "Jawohl! Phil ist der Liebste! 💖",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#FFF8E7"/>
      <text x="150" y="112" font-size="74" text-anchor="middle">🏆<animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur=".9s" repeatCount="indefinite" additive="sum" transformOrigin="150 78"/></text>
      <text x="48"  y="68"  font-size="24"><animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/>🌟</text>
      <text x="236" y="68"  font-size="24"><animate attributeName="opacity" values="0;1;0" dur="1.0s" repeatCount="indefinite"/>🌟</text>
      <text x="48"  y="132" font-size="18"><animate attributeName="opacity" values="0;1;0" dur="1.3s" begin=".3s" repeatCount="indefinite"/>✨</text>
      <text x="236" y="132" font-size="18"><animate attributeName="opacity" values="1;0;1" dur="1.3s" begin=".3s" repeatCount="indefinite"/>✨</text>
      <text x="150" y="175" font-size="14" text-anchor="middle" fill="#FF8C69" font-family="sans-serif" font-weight="bold">Der Liebste überhaupt!</text>
    </svg>`
  },
  {
    text: "Phil hat so viel Liebe! 🌈",
    svg: `<svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="185" fill="#F0F8FF"/>
      <path d="M18 152 Q150 12 282 152" fill="none" stroke="#FF6B9D" stroke-width="11" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" from="600" to="0" dur=".9s" fill="freeze"/></path>
      <path d="M32 152 Q150 30 268 152" fill="none" stroke="#FF8C69" stroke-width="11" stroke-linecap="round" stroke-dasharray="560" stroke-dashoffset="560"><animate attributeName="stroke-dashoffset" from="560" to="0" dur=".9s" begin=".15s" fill="freeze"/></path>
      <path d="M46 152 Q150 48 254 152" fill="none" stroke="#FFD93D" stroke-width="11" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520"><animate attributeName="stroke-dashoffset" from="520" to="0" dur=".9s" begin=".30s" fill="freeze"/></path>
      <path d="M60 152 Q150 65 240 152" fill="none" stroke="#7BC67E" stroke-width="11" stroke-linecap="round" stroke-dasharray="470" stroke-dashoffset="470"><animate attributeName="stroke-dashoffset" from="470" to="0" dur=".9s" begin=".45s" fill="freeze"/></path>
      <path d="M74 152 Q150 82 226 152" fill="none" stroke="#89CFF0" stroke-width="11" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" from="420" to="0" dur=".9s" begin=".60s" fill="freeze"/></path>
      <text x="150" y="178" font-size="14" text-anchor="middle" fill="#6A5ACD" font-family="sans-serif" font-weight="bold">So viel Liebe! 🌈</text>
    </svg>`
  }
];

let lastIdx = -1;

document.getElementById('askBtn').addEventListener('click', function() {
  let idx;
  do { idx = Math.floor(Math.random() * answers.length); }
  while (idx === lastIdx && answers.length > 1);
  lastIdx = idx;

  document.getElementById('answerText').textContent = answers[idx].text;
  document.getElementById('animFrame').innerHTML = answers[idx].svg;
  document.getElementById('card').classList.add('show');

  spawnConfetti();
});

function spawnConfetti() {
  const box = document.getElementById('confetti');
  box.innerHTML = '';
  const colors = ['#FFD93D','#FF6B9D','#FF8C69','#A8EDCA','#89CFF0','#FFC0CB','#C9B1FF'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('div');
    p.className = 'cp';
    const s = 6 + Math.random() * 10;
    p.style.cssText = `left:${5+Math.random()*90}vw;top:-12px;width:${s}px;height:${s}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.6+Math.random()*2.2}s;animation-delay:${Math.random()*.7}s`;
    box.appendChild(p);
  }
  setTimeout(() => box.innerHTML = '', 5000);
}
</script>
</body>
</html>
